# A0 — Fixed, non-R-centered baseline (matched A0-A4 ablation, Table 2)
experiment: A0
description: >
  Fixed non-R-centered 360-sample windows, generated with a fixed stride of
  256 samples (no R-peak alignment). Establishes the non-physiologically-guided
  reference point for the matched ablation.

sampling_rate_hz: 250

window:
  length: 360
  r_centered: false
  stride: 256

model:
  architecture: RPeakGuidedML2
  input_channels: 1
  conv1_filters: 32
  conv1_kernel: 7
  conv2_filters: 64
  conv2_kernel: 5
  bilstm_hidden: 128
  bilstm_layers: 1
  bidirectional: true
  dropout: 0.3
  num_classes: 3

training:
  optimizer: Adam
  learning_rate: 0.001
  batch_size: 64
  epochs: 15
  seeds: [1, 2, 3]
  early_stopping: false
  checkpoint_selection: best_validation_macro_f1

loss:
  type: unweighted_focal
  gamma: 2.0

dataset:
  train: qtdb_train
  validation: qtdb_validation
  test: ludb_test

results:
  ludb_macro_f1_mean: 0.7999
  ludb_macro_f1_std: 0.0042
