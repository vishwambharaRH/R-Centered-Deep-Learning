# R2 — Weighted focal loss (developmental R1-R6, Table 3)
experiment: R2
description: >
  Same architecture/windows as R1, but with class-weighted focal loss to
  address class imbalance. Increased P/T recall but reduced precision and
  overall Macro F1.

sampling_rate_hz: 250
window: {length: 360, r_centered: true, pre_r: 120, post_r: 240}

model:
  architecture: RPeakGuidedML2
  input_channels: 1
  conv1_filters: 32
  conv1_kernel: 7
  conv2_filters: 64
  conv2_kernel: 5
  bilstm_hidden: 128
  dropout: 0.3
  num_classes: 3

training:
  optimizer: Adam
  learning_rate: 0.001
  batch_size: 64
  epochs: 30
  checkpoint_selection: best_validation_loss

loss:
  type: weighted_focal
  gamma: 2.0
  alpha: inverse_class_frequency
  alpha_values_qtdb_train: [0.5175, 2.7187, 1.4292]  # [Background, P, T]

dataset:
  train: qtdb_train
  validation: qtdb_validation
  test: ludb_full_200

results:
  qtdb_macro_f1: 0.8420
  ludb_macro_f1: 0.7604
  best_epoch: 20
  best_validation_loss: 0.0605
  checkpoint: best_ml2_rpeak_guided_focal.pth
