<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 220" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #f5f5f5; stroke: #999; stroke-width: 1; rx: 6; }
    .box-accent { fill: #eaf3ee; stroke: #2a8f5f; stroke-width: 1.3; rx: 6; }
    .title { font-size: 12px; font-weight: 600; fill: #222; }
    .sub { font-size: 10.5px; fill: #555; }
    .arrow { stroke: #777; stroke-width: 1.5; marker-end: url(#head); fill: none; }
  </style>
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#777"/>
    </marker>
  </defs>

  <!-- Input -->
  <rect class="box" x="10" y="70" width="110" height="70"/>
  <text class="title" x="65" y="98" text-anchor="middle">Input</text>
  <text class="sub" x="65" y="114" text-anchor="middle">1 or 2 × 360</text>
  <text class="sub" x="65" y="127" text-anchor="middle">or 1 or 2 × 440</text>

  <line class="arrow" x1="120" y1="105" x2="150" y2="105"/>

  <!-- Conv block 1 -->
  <rect class="box" x="150" y="60" width="150" height="90"/>
  <text class="title" x="225" y="80" text-anchor="middle">Conv1D(32, k=7)</text>
  <text class="sub" x="225" y="96" text-anchor="middle">BatchNorm1d(32)</text>
  <text class="sub" x="225" y="110" text-anchor="middle">ReLU</text>
  <text class="sub" x="225" y="130" text-anchor="middle" fill="#2a8f5f">order: Conv → BN → ReLU</text>

  <line class="arrow" x1="300" y1="105" x2="330" y2="105"/>

  <!-- Conv block 2 -->
  <rect class="box" x="330" y="60" width="150" height="90"/>
  <text class="title" x="405" y="80" text-anchor="middle">Conv1D(64, k=5)</text>
  <text class="sub" x="405" y="96" text-anchor="middle">BatchNorm1d(64)</text>
  <text class="sub" x="405" y="110" text-anchor="middle">ReLU</text>
  <text class="sub" x="405" y="130" text-anchor="middle" fill="#2a8f5f">order: Conv → BN → ReLU</text>

  <line class="arrow" x1="480" y1="105" x2="510" y2="105"/>

  <!-- BiLSTM -->
  <rect class="box" x="510" y="60" width="140" height="90"/>
  <text class="title" x="580" y="90" text-anchor="middle">BiLSTM</text>
  <text class="sub" x="580" y="108" text-anchor="middle">128 units × 2 dir.</text>
  <text class="sub" x="580" y="122" text-anchor="middle">→ 256-d output</text>

  <line class="arrow" x1="650" y1="105" x2="680" y2="105"/>

  <!-- Dropout -->
  <rect class="box" x="680" y="70" width="100" height="70"/>
  <text class="title" x="730" y="98" text-anchor="middle">Dropout</text>
  <text class="sub" x="730" y="114" text-anchor="middle">p = 0.3</text>

  <line class="arrow" x1="780" y1="105" x2="810" y2="105"/>

  <!-- Linear -->
  <rect class="box-accent" x="810" y="60" width="160" height="90"/>
  <text class="title" x="890" y="90" text-anchor="middle">Linear(256 → 3)</text>
  <text class="sub" x="890" y="108" text-anchor="middle">per-timestep softmax</text>
  <text class="sub" x="890" y="122" text-anchor="middle">Background / P / T</text>

  <text class="sub" x="490" y="20" text-anchor="middle" fill="#8a5a1f">
    Corrected from the paper's Fig. 1: actual window length is 360/440 samples (not N=512), and the
  </text>
  <text class="sub" x="490" y="34" text-anchor="middle" fill="#8a5a1f">
    real per-block order is Conv1D → BatchNorm → ReLU (Fig. 1 depicts Conv1D → ReLU → BatchNorm). See src/models/cnn_bilstm.py.
  </text>
</svg>
